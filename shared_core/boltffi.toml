[package]
name = "shared_core"

[targets.apple]
enabled = true
output = "../ios/LogNCoreFFI"
deployment_target = "16.0"
include_macos = false

[targets.apple.swift]
module_name = "LogNCoreFFI"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"

# Cliente Android (ADR 0023). A saída vai para android/generated/, fora do git: toda
# receita de build passa por `just android/generate`, e .so velho com tipos novos é
# variante de bincode trocada. min_sdk e architectures têm de bater com o Gradle.
[targets.android]
enabled = true
output = "../android/generated/boltffi"
min_sdk = 26
# r28 ou mais alinha o .so em páginas de 16 KB por padrão.
ndk_version = "29.0.14206865"
architectures = ["arm64", "x86_64"]

[targets.android.kotlin]
output = "../android/generated/boltffi/kotlin"
package = "sh.logn.ffi"
module_name = "LogNCoreFFI"
library_name = "shared_core"
desktop_loader = "none"

[targets.android.pack]
output = "../android/generated/boltffi/jniLibs"

# PostHog só simboliza `.so` com build ID GNU (ADR 0024), e o clang do NDK chamado direto
# não põe um. É o que casa o frame do tombstone com os símbolos que subiram.
[targets.android.link]
extra_args = ["-Wl,--build-id=sha1"]

# Recusa o pack se o perfil perder a debug info. O zip que ele escreve em
# generated/boltffi/symbols não é usado: o plugin de PostHog lê o .so do merge do Gradle.
[targets.android.debug_symbols]
enabled = true

[targets.android.header]
output = "../android/generated/boltffi/include"

[targets.wasm]
enabled = false
