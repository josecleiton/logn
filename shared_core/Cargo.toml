[package]
name = "shared_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["crux_core/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]

[dependencies]
facet = { version = "=0.46.5", features = ["chrono"] }
facet-generate-attrs = "0.18"
boltffi = "0.30.1"
crux_core = "0.20.0"
crux_http = { version = "0.20.0", features = ["facet_typegen"] }
crux_macros = "0.10.1"
serde = { version = "1.0", features = ["derive"] }

# Codegen ops
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", optional = true, features = ["derive"] }
log = { version = "0.4", optional = true }
pretty_env_logger = { version = "0.5", optional = true }
sha2 = "0.11.0"
serde_json = "1.0.151"

[dev-dependencies]
crux_core = { version = "0.20", features = ["testing"] }
