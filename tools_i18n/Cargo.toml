[package]
name = "logn-i18n"
version = "0.1.0"
edition = "2024"
description = "Turns the i18n/ catalog into native string resources for every shell"

[[bin]]
name = "i18n"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.2"
