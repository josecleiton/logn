# A página de exclusão de conta que a ficha do Google Play exige. Repete a política
# (seção 10 e direitos); se ela mudar, isto muda junto.
[delete]
title = "Excluir conta — LogN"
description = "Como excluir sua conta e seus dados, pelo app ou por e-mail."
heading = "Excluir sua conta"
lead = "Pelo app a exclusão é na hora. Sem o app instalado, peça por e-mail."
in_app_title = "Pelo app"
in_app_body = "Abra Gerenciar conta → Excluir minha conta, digite EXCLUIR e confirme que é você: com a senha, ou entrando de novo com sua conta Google, Apple ou GitHub."
in_app_after = "A conta é desativada na hora. Se você entrar ou redefinir a senha nos 30 dias seguintes, a exclusão é cancelada. Depois disso ela é eliminada de vez, em até 31 dias do pedido: e-mail, senha, progresso, XP, licenças das trilhas e histórico."
no_app_title = "Sem o app"
no_app_before = "Escreva para"
no_app_after = "a partir do e-mail cadastrado na conta, pedindo a exclusão. Respondemos em até 15 dias. Se o pedido vier de outro endereço, pedimos que você confirme respondendo a partir do e-mail cadastrado."
kept_title = "O que fica"
kept_body = "Excluir a conta não reembolsa trilhas compradas. O registro das compras fica por 5 anos, sem seu e-mail, para restauração, reembolso e prevenção de fraude. Registros técnicos do servidor somem sozinhos em até 30 dias."
policy = "política de privacidade"

[notfound]
title = "Página não encontrada — LogN"
heading = "Wrong Answer."
lead = "Esta página não existe. Volte ao início e tente de novo — sem penalidade."
back = "voltar ao início"
