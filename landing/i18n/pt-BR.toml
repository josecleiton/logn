note = "Só para esse aviso. Você confirma pelo link que mandarmos e sai da lista quando quiser."
thanks_title = "Confira seu e-mail."
thanks_lead = "Se o endereço estiver certo, mandamos um link de confirmação. Você só entra na lista depois de abrir esse link."
confirmed_title = "Você está na lista."
