[session]
kicker = "A SESSÃO"
title = "Três vidas, relógio correndo, quatro formatos."
lead = "Nada de editor em branco no celular. Cada questão isola uma decisão — a linha certa, o bug, a complexidade — e cabe numa fila de ônibus."
a_name = "Complete a linha"
a_desc = "O algoritmo está pronto, falta uma linha. Você escolhe entre quatro candidatas quase iguais."
a_sample = "i < n  │  i <= n"
b_name = "Ache o bug"
b_desc = "Seis linhas, uma errada. Toque na linha que quebra no caso de borda."
