[hero]
kicker = "13 PROBLEMAS · 5 HORAS · UM PLACAR — AGORA EM 3 MINUTOS"
title = "Reduza a complexidade das suas soluções."
lead = "Treino de algoritmos, DevOps e engenharia com IA na gramática de uma maratona de programação: problemas por letra, balão por cor, placar que congela na última hora."
balloons_label = "Treze balões, um por problema"

[phone]
label = "Tela do app durante uma questão"
problem = "PROBLEM F"
lives = "Duas vidas de três"
title = "F · SOMA DE DOIS NÚMEROS"
statement = "Devolva a soma de a e b. Complete a expressão."
fn = "soma"
drag = "ARRASTE O BLOCO"
drop = "solte aqui"
confirm = "Confirmar resposta"

[session]
kicker = "A SESSÃO"
title = "Três vidas, relógio correndo, quatro formatos."
lead = "Nada de editor em branco no celular. Cada questão isola uma decisão — a linha certa, o bug, a complexidade — e cabe numa fila de ônibus."
a_name = "Complete a linha"
a_desc = "O algoritmo está pronto, falta uma linha. Você escolhe entre quatro candidatas quase iguais."
a_sample = "i < n  │  i <= n"
b_name = "Ache o bug"
b_desc = "Seis linhas, uma errada. Toque na linha que quebra no caso de borda."
b_sample = "for (i = 0; i <= n; i++)  ← aqui"
c_name = "Case a complexidade"
c_desc = "Arraste cada trecho até a notação certa. O relógio conta."
c_sample = "dois laços aninhados → O(n²)"
d_name = "Dry run"
d_desc = "Execute de cabeça e diga o que sai. Sem compilar, sem print."
d_sample = "saída: [1, 3, 3, 7]"
traps = "Errou numa trap clássica — off-by-one, overflow em mid, visitado marcado tarde — e o app explica por quê antes da próxima questão."

[tracks]
kicker = "TRILHAS"
title = "O currículo é um grafo. Você vê as arestas."
lead = "Cada técnica é um balão; cada pré-requisito, uma cordinha. Uma técnica só abre depois das que ela usa — e o mapa mostra por quê."
algo_name = "Algoritmos e estruturas"
algo_topics = "busca, grafos, DP, heaps"
