# Cópia da landing page em português do Brasil.
#
# Toda língua em `i18n/` tem exatamente estas chaves; o `build.mjs` recusa arquivo com
# chave a mais ou a menos. Valor é texto puro: o build escapa HTML, então `<`, `&` e
# aspas entram como são.
#
# Nada de currículo aqui (AGENTS.md, regra 8). O desafio do celular e os trechos dos
# formatos são inventados, no molde de `ch_t01`; o placar usa times fictícios.

[meta]
title = "LogN — Reduza a complexidade das suas soluções"
description = "Treino de algoritmos, DevOps e engenharia com IA em sessões de três minutos, com a gramática de uma maratona de programação. Código aberto."
