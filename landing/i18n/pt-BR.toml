title = "O app inteiro está no GitHub. Só as questões ficam na gaveta."
lead = "Core, clientes e backend são abertos para ler, forkar e mandar PR. O único pedaço fechado é o conteúdo das trilhas — publicar o gabarito estragaria o contest."
open = "ABERTO"
core_note = "Regras do jogo, placar e sincronização offline num núcleo só."
