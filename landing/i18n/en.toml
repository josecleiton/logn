[delete]
title = "Delete account — LogN"
description = "How to delete your account and your data, in the app or by e-mail."
heading = "Delete your account"
lead = "In the app, deletion is immediate. Without the app installed, ask by e-mail."
in_app_title = "In the app"
in_app_body = "Open Manage account → Delete my account, type EXCLUIR and confirm it is you: with your password, or by signing in again with your Google, Apple or GitHub account."
in_app_after = "The account is deactivated right away. If you sign in or reset your password within the next 30 days, the deletion is cancelled. After that it is erased for good, within 31 days of the request: e-mail, password, progress, XP, track licences and history."
no_app_title = "Without the app"
no_app_before = "Write to"
no_app_after = "from the e-mail address registered to the account, asking for deletion. We reply within 15 days. If the request comes from another address, we ask you to confirm it by replying from the registered one."
kept_title = "What stays"
kept_body = "Deleting the account does not refund purchased tracks. The purchase record is kept for 5 years, without your e-mail, for restoring, refunds and fraud prevention. Technical server logs disappear on their own within 30 days."
