    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LogNiOS
    dependencies:
      - package: LogNCoreFFI
      - package: App
    info:
      path: LogNiOS/Info.plist
      properties:
        UILaunchScreen: {}
