name: LogNiOS
options:
  bundleIdPrefix: sh.logn
  deploymentTarget:
    iOS: '16.0'
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  LogNCoreFFI:
    path: ../LogNCoreFFI
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0
targets:
  LogNiOS:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    bundleId: sh.logn.app

    sources:
    - path: LogNiOS
    dependencies:
    - package: LogNCoreFFI
    - package: PostHog
    settings:
      DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
      # Sign in with Apple (ADR 0017): o time gratuito não assina a capability, e o
      # build quebraria com ela. Vazio no .env, o app sai sem entitlement e sem o botão;
      # com o time pago, LOGN_CODE_SIGN_ENTITLEMENTS = LogNiOS/LogNiOS.entitlements.
      CODE_SIGN_ENTITLEMENTS: $(LOGN_CODE_SIGN_ENTITLEMENTS)
      # O mesmo par do Info.plist, para o Xcode mostrar no painel do alvo o que embarca.
      MARKETING_VERSION: ${LOGN_VERSION_NAME}
      CURRENT_PROJECT_VERSION: ${LOGN_VERSION_BUILD}
      INFOPLIST_KEY_CFBundleDisplayName: LogN
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.educational-games"
      INFOPLIST_KEY_LSApplicationSecondaryCategoryType: "public.app-category.education"
    info:
      path: LogNiOS/Info.plist
      properties:
        CFBundleDisplayName: LogN
        # De ../../version.properties, pelas variáveis que o `just xcode` exporta antes
        # do XcodeGen. Sem estas duas ele escreve os defaults, 1.0 e 1. `${...}` aqui é
        # interpolação do XcodeGen e deixa um número literal na plist, que o `just
        # version-check` consegue conferir; `$(MARKETING_VERSION)` seria resolvido só no
        # build, e um xcodebuild de fora poderia sobrescrever.
        CFBundleShortVersionString: ${LOGN_VERSION_NAME}
        CFBundleVersion: ${LOGN_VERSION_BUILD}
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        # A cor do canvas (LognDark.canvas): a passagem da tela de lançamento para a
        # splash não pisca em branco.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # O backend de desenvolvimento fala HTTP puro, e o ATS bloqueia isso por
        # padrão em qualquer destino que não seja localhost — no simulador passava,
        # no aparelho não. NSAllowsLocalNetworking libera só a rede local: HTTP para
        # a internet continua barrado, então isto não é o mesmo que desligar o ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A partir do iOS 14 falar com um IP da rede local pede permissão, e o
        # sistema mostra este texto no pedido.
        NSLocalNetworkUsageDescription: O LogN fala com o servidor de desenvolvimento rodando no seu computador, na mesma rede.
        LogNApiBaseURL: ${API_BASE_URL}
        LogNTelemetryKey: ${TELEMETRY_KEY}
        LogNPostHogHost: ${POSTHOG_HOST}
        # Client ID iOS do login com Google (ADR 0016). Vazio, o botão não aparece.
        LogNGoogleClientID: ${GOOGLE_IOS_CLIENT_ID}
        # Client ID do OAuth App do GitHub (ADR 0019). Vazio, o botão não aparece. O
        # secret nunca vem para cá: a troca do código é do servidor.
        LogNGitHubClientID: ${GITHUB_CLIENT_ID}
        # O mesmo valor do entitlement: sem ele, o botão da Apple não aparece.
        LogNAppleSignIn: ${LOGN_CODE_SIGN_ENTITLEMENTS}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - logn
            CFBundleURLName: sh.logn.app

schemes:
  LogNiOS:
    build:
      targets:
        LogNiOS: all
    run:
      config: Debug
      storeKitConfiguration: LogNiOS/StoreKitConfig.storekit
