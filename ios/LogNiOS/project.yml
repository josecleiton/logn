name: LogNiOS
options:
  bundleIdPrefix: sh.logn
  deploymentTarget:
    iOS: '16.0'
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  LogNCoreFFI:
    path: ../LogNCoreFFI
  App:
    path: ../SharedCore/App
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0
targets:
  LogNiOS:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    bundleId: sh.logn.app

    sources:
    - path: LogNiOS
    dependencies:
    - package: LogNCoreFFI
    - package: App
    - package: PostHog
    settings:
      DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
      INFOPLIST_KEY_CFBundleDisplayName: LogN
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.educational-games"
    info:
      path: LogNiOS/Info.plist
      properties:
        CFBundleDisplayName: LogN
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LogNApiBaseURL: ${API_BASE_URL}
        LogNTelemetryKey: ${TELEMETRY_KEY}
        LogNPostHogHost: ${POSTHOG_HOST}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - logn
            CFBundleURLName: sh.logn.app
