name: LogNiOS
options:
  bundleIdPrefix: sh.logn
  deploymentTarget:
    iOS: '16.0'
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  LogNCoreFFI:
    path: ../LogNCoreFFI
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0
targets:
  LogNiOS:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    bundleId: sh.logn.app

    sources:
    - path: LogNiOS
    dependencies:
    - package: LogNCoreFFI
    - package: PostHog
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: sh.logn.app
      TARGETED_DEVICE_FAMILY: "1"
      DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
      INFOPLIST_KEY_CFBundleDisplayName: LogN
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.educational-games"
      INFOPLIST_KEY_LSApplicationSecondaryCategoryType: "public.app-category.education"
    info:
      path: LogNiOS/Info.plist
      properties:
        CFBundleDisplayName: LogN
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # O backend de desenvolvimento fala HTTP puro, e o ATS bloqueia isso por
        # padrão em qualquer destino que não seja localhost — no simulador passava,
        # no aparelho não. NSAllowsLocalNetworking libera só a rede local: HTTP para
        # a internet continua barrado, então isto não é o mesmo que desligar o ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A partir do iOS 14 falar com um IP da rede local pede permissão, e o
        # sistema mostra este texto no pedido.
        NSLocalNetworkUsageDescription: O LogN fala com o servidor de desenvolvimento rodando no seu computador, na mesma rede.
        LogNApiBaseURL: ${API_BASE_URL}
        LogNTelemetryKey: ${TELEMETRY_KEY}
        LogNPostHogHost: ${POSTHOG_HOST}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - logn
            CFBundleURLName: sh.logn.app
