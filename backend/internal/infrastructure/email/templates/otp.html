<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #0d0d12; color: #ffffff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #1a1a24; padding: 30px; border-radius: 8px; text-align: center; }
        .otp { font-size: 36px; font-weight: bold; color: #00e5ff; letter-spacing: 4px; margin: 20px 0; padding: 15px; background: #2a2a35; border-radius: 4px; }
        .footer { font-size: 12px; color: #888888; margin-top: 30px; }
        .logo { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="cid:logo.jpg" alt="LogN Logo" class="logo" />
        <h2>LogN - {{.Subject}}</h2>
        <p>Utilize o código numérico abaixo para completar sua solicitação. Ele expira em 15 minutos.</p>
        <div class="otp">{{.Code}}</div>
        <p>Se você não solicitou este código, por favor ignore este e-mail.</p>
        <div class="footer">LogN - Algorithmic Intelligence</div>
    </div>
</body>
</html>
