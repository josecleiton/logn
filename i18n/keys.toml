source_language = "en"

[groups.app.keys]
name = {}
subtitle = {}

[groups.login.keys]
sign_in_apple = {}
sign_in_google = {}
sign_in_github = {}
action_sign_in = {}
or_separator = {}
continue_as_guest = {}

[groups.dashboard.keys]
fetching = {}
syncing = {}
loaded = {}
sync_guest_warning = {}
tree_unavailable = {}
offline_session = {}

# O que o Core tem a dizer ao jogador.
#
# O Core manda a **chave** (`StatusKey`), nunca a frase: quem traduz é o cliente.
# Antes ele escrevia a frase pronta, e a tela de login abria com "Logged out
# successfully" em inglês, no vermelho de erro, num app em português.
[groups.status.keys]
signing_in = {}
wrong_credentials = {}
sign_in_failed = {}
no_connection = {}
server_unreadable = {}
session_expired = {}
signing_out = {}
resuming_session = {}
sending_code = {}
code_sent_failed = {}
checking_code = {}
code_invalid = {}
creating_account = {}
account_failed = {}
resetting_password = {}
reset_failed = {}
syncing = {}
sync_diverged = {}
sync_failed = {}
sync_offline = {}
sign_in_to_sync = {}
trail_from_bundle = { placeholders = [{ name = "date", type = "text" }] }
rate_limited = {}
wait_seconds = { placeholders = [{ name = "seconds", type = "int" }] }
sample_standings = {}

# Sair da partida. O Core decide se pergunta; a cópia mora aqui.
[groups.leave.keys]
eyebrow = {}
solved = { placeholders = [{ name = "solved", type = "int" }, { name = "total", type = "int" }] }
body = {}
stay = {}
confirm = {}
accessibility = {}

# Desafio que já rendeu XP. Rejogar não paga de novo, e a trilha, o sheet do nó, o
# veredito e o relatório dizem isso — sem aviso, o XP parado parece defeito.
[groups.solved.keys]
inflating = { placeholders = [{ name = "solved", type = "int" }, { name = "total", type = "int" }] }
node_accessibility = { placeholders = [{ name = "solved", type = "int" }, { name = "total", type = "int" }] }
problems = {}
count = { placeholders = [{ name = "solved", type = "int" }, { name = "total", type = "int" }] }
done = {}
worth = { placeholders = [{ name = "xp", type = "int" }] }
problem_done_accessibility = { placeholders = [{ name = "letter", type = "text" }] }
problem_open_accessibility = { placeholders = [{ name = "letter", type = "text" }, { name = "xp", type = "int" }] }
in_play = {}
start = {}
resume = {}
replay = {}
verdict = {}
verdict_accessibility = { placeholders = [{ name = "letter", type = "text" }] }
report_xp = { placeholders = [{ name = "xp", type = "int" }] }
report_repeated = { plural = true, placeholders = [{ name = "count", type = "int" }] }

# Origem do desafio. A chave vem do Core (a coluna `origin`); a cópia mora aqui.
[groups.origin.keys]
eyebrow = {}
origin_name = {}
origin_role = {}
origin_body = {}
pause_notice = {}
close = {}
