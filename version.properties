# O único lugar onde a versão do app é escrita, para iOS e Android.
#
# Antes deste arquivo cada shell tinha a sua: o iOS dizia 1.0 (1), o default que o
# XcodeGen preenche quando ninguém declara nada, e o Android dizia 0.1.0 (3), escrito
# à mão no build.gradle.kts. Nenhum dos dois estava errado sozinho, e o rodapé do
# perfil mostrava dois apps diferentes para o mesmo estado do produto.
#
# `.properties` e não `.toml`: o Gradle lê com `Properties().load`, sem parser a mais.
#
# Quem lê:
#   android/settings.gradle.kts → versionName e versionCode do :app
#   just xcode                  → CFBundleShortVersionString e CFBundleVersion do iOS
#
# `just version-check` confere se o Info.plist gerado diz o mesmo que este arquivo.
# Sobe à mão, a cada release.

# A versão que o jogador lê.
name=1.0.0

# O número do build, o mesmo nas duas lojas. Cada upload no Play Console gasta um: o
# próximo tem de ser maior que o último enviado, mesmo que ele tenha sido recusado.
build=6
